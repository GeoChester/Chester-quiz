<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chester's Geoquiz VI</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;                 /* phones: a finger drag moves the light, it does not scroll the page */
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }

  /* The hidden text layer. It is always there, but a soft circular mask
     (set from the script below) lets it show only around the cursor. */
  #hidden {
    position: fixed; inset: 0;
    --x: -999px; --y: -999px; --r: 0px;
    -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(circle var(--r) at var(--x) var(--y),
        #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,0) 100%);
    user-select: none; -webkit-user-select: none;
    pointer-events: none;
  }

  /* Each piece of hidden text is placed anywhere on the page with left/top. */
  #hidden .t {
    position: absolute;
    white-space: nowrap;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: bold;
    letter-spacing: .04em;
    transform: translate(-50%, -50%);
  }

  /* Blacklight colours: violet, cyan, green, magenta, yellow-green */
  .violet  { color: #b967ff; text-shadow: 0 0 10px #b967ff, 0 0 26px #7a2cff; }
  .cyan    { color: #3ff3ff; text-shadow: 0 0 10px #3ff3ff, 0 0 26px #00a9ff; }
  .green   { color: #7dff6a; text-shadow: 0 0 10px #7dff6a, 0 0 26px #1fe05a; }
  .magenta { color: #ff4fd8; text-shadow: 0 0 10px #ff4fd8, 0 0 26px #d0159f; }
  .lime    { color: #d4ff3a; text-shadow: 0 0 10px #d4ff3a, 0 0 26px #9bd400; }

  /* Text sizes */
  .xl { font-size: clamp(34px, 6vw, 78px); }
  .l  { font-size: clamp(24px, 4vw, 52px); }
  .m  { font-size: clamp(18px, 2.6vw, 34px); }
  .s  { font-size: clamp(14px, 1.8vw, 24px); }
</style>
</head>
<body>

<!-- ============ EDIT YOUR HIDDEN TEXT HERE ============
     left / top are percentages of the page. Colour classes:
     violet, cyan, green, magenta, lime.  Size classes: xl, l, m, s.
     Add or remove lines freely. -->
<div id="hidden">
  <div class="t violet  xl" style="left:50%; top:20%;">Chester has hidden</div>
  <div class="t violet  xl" style="left:50%; top:40%;">a cache for you</div>
  <div class="t cyan    m"  style="left:50%; top:60%;">Go find it at</div>
  <div class="t green   l"  style="left:30%; top:75%;">N 38° 53.248</div>
  <div class="t magenta l"  style="left:70%; top:88%;">W 77° 08.390</div>
</div>

<script>
  const layer = document.getElementById("hidden");
  const RADIUS = 60;          // size of the light, in pixels (make it bigger or smaller)
  let tx = -999, ty = -999;    // where the cursor is
  let x = -999, y = -999;      // where the light is (it trails the cursor smoothly)
  let r = 0, targetR = 0;      // current and target size of the light

  const TOUCH_LIFT = 70;       // on phones the light sits this many pixels above the finger so the finger doesn't cover it

  function show(e) { tx = e.clientX; ty = e.clientY - (e.pointerType === "touch" ? TOUCH_LIFT : 0); targetR = RADIUS;
                     if (r < 1) { x = tx; y = ty; } }
  function hide()  { targetR = 0; }

  window.addEventListener("pointermove", show);
  window.addEventListener("pointerdown", show);
  window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") hide(); });
  window.addEventListener("pointercancel", hide);
  document.addEventListener("mouseleave", hide);
  window.addEventListener("blur", hide);

  function frame() {
    x += (tx - x) * 0.25;                 // small delay gives a "flashlight" feel
    y += (ty - y) * 0.25;
    r += (targetR - r) * 0.18;            // light grows in and shrinks away
    if (r < 0.5 && targetR === 0) r = 0;
    layer.style.setProperty("--x", x + "px");
    layer.style.setProperty("--y", y + "px");
    layer.style.setProperty("--r", r + "px");
    requestAnimationFrame(frame);
  }
  frame();
</script>
<img id="flashlight" alt="" src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2796%27%20height=%2796%27%20viewBox=%270%200%2064%2064%27%3E%3Cdefs%3E%3CradialGradient%20id=%27g%27%20cx=%2750%25%27%20cy=%2750%25%27%20r=%2750%25%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%23ffffff%27%20stop-opacity=%27.95%27/%3E%3Cstop%20offset=%27.5%27%20stop-color=%27%23d9c2ff%27%20stop-opacity=%27.55%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%23b967ff%27%20stop-opacity=%270%27/%3E%3C/radialGradient%3E%3ClinearGradient%20id=%27b%27%20x1=%270%27%20x2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%235b3a9c%27/%3E%3Cstop%20offset=%27.5%27%20stop-color=%27%239a6fe6%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%233a2288%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg%20transform=%27translate(8%208)%20rotate(-45%2032%2032)%27%3E%3Cellipse%20cx=%2732%27%20cy=%272%27%20rx=%2715%27%20ry=%2712%27%20fill=%27url(%23g)%27/%3E%3Cpath%20d=%27M22%206L42%206L37%2020L27%2020Z%27%20fill=%27%232b1658%27%20stroke=%27%237dffa6%27%20stroke-width=%271.2%27/%3E%3Cellipse%20cx=%2732%27%20cy=%276%27%20rx=%2710%27%20ry=%272.8%27%20fill=%27%23fff7c2%27%20stroke=%27%237dffa6%27%20stroke-width=%271%27/%3E%3Crect%20x=%2727%27%20y=%2720%27%20width=%2710%27%20height=%2734%27%20rx=%273%27%20fill=%27url(%23b)%27%20stroke=%27%232b1658%27%20stroke-width=%271.2%27/%3E%3Crect%20x=%2729.5%27%20y=%2728%27%20width=%275%27%20height=%277%27%20rx=%272%27%20fill=%27%237dffa6%27/%3E%3Crect%20x=%2726%27%20y=%2719%27%20width=%2712%27%20height=%273%27%20rx=%271.5%27%20fill=%27%23c79bff%27/%3E%3C/g%3E%3C/svg%3E" style="position:fixed;left:0;top:0;width:96px;height:96px;pointer-events:none;z-index:99999;transform:translate(-300px,-300px);">
<script>
(function () {
  var f = document.getElementById("flashlight");
  var HX = 32, HY = 32;   // the lens (where the light comes from) inside the 96px icon
  if (!window.matchMedia("(pointer:fine)").matches) { f.style.display = "none"; return; }   // phones: no cursor, so hide it
  var s = document.createElement("style");
  s.textContent = "*{cursor:none !important}";
  document.head.appendChild(s);
  window.addEventListener("pointermove", function (e) {
    f.style.transform = "translate(" + (e.clientX - HX) + "px," + (e.clientY - HY) + "px)";
  });
  document.addEventListener("mouseleave", function () { f.style.transform = "translate(-300px,-300px)"; });
})();
</script>
</body>
</html>
